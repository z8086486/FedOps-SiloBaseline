# Federated Task Release configuration (Baseline 0.9).
# This file owns the verified model, data contract, and local-training defaults.
# Web Server Management supplies each run's rounds/clients/strategy as a Campaign overlay.
schema_version: 2
random_seed: 42

# FedOps 1.2-compatible transport type. This Baseline currently supports PyTorch.
model_type: Pytorch
model:
  # EDIT: this is the model name shown on the Registry card. It may be shared by other Tasks.
  display_name: replace-with-primary-model-name
  # EDIT: constructor identifier plus values consumed by model.build_model(config).
  # Example: input_size: 8, output_size: 2
  name: replace-with-model-name

dataset:
  # EDIT: logical contract name. Do not put a participant filesystem path here.
  name: replace-with-dataset-name
  validation_split: 0.2
  download: false

local_training:
  # EDIT and verify these values with Agent Studio Local Training.
  learning_rate: 0.001
  epochs: 1
  batch_size: 32

federation:
  # The first organized contract intentionally supports only the tested strategy.
  supported_strategies:
  - name: FedAvg
    target: flwr.server.strategy.FedAvg
  recommended_campaign:
    rounds: 2
    clients_per_round: 1
    strategy: FedAvg

# Monitoring credentials and local paths are local Agent Studio state, never Release values.
monitoring:
  wandb: false
