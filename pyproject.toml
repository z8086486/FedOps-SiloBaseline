[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fedops-silo-baseline"
version = "0.2.0"
description = "FedOps owner starter for local validation and silo participation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy==1.26.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
participate = [
    "fedops==1.1.30.13",
    "fastapi==0.116.1",
    "omegaconf==2.3.0",
    "requests==2.32.4",
    "uvicorn==0.35.0",
]

[project.scripts]
fedops-task = "fedops_silo_baseline.launcher_app:main"

[tool.hatch.build.targets.wheel]
packages = ["fedops_silo_baseline"]

[tool.fedops.task]
schema-version = 1
task-type = "silo"
runtime-module = "fedops_silo_baseline.launcher_app"
model-file = "fedops_silo_baseline/model.py"
data-preparation-file = "fedops_silo_baseline/data_preparation.py"
config-file = "fedops_silo_baseline/conf/config.toml"
